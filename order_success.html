<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Successful | FandomVerse</title>
    <link rel="stylesheet" href="CSS/style.css">
    <style>
        .success-box {
            text-align: center;
            max-width: 600px;
            margin: 100px auto;
            padding: 50px 30px;
            border-radius: 20px;
        }

        .checkmark {
            font-size: 5rem;
            color: #00e676;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <header class="glass" style="margin-bottom: 0;">
        <a href="index.html" class="logo" style="margin: 0 auto;">FandomVerse</a>
    </header>

    <main class="container">
        <div class="glass success-box">
            <div class="checkmark">✔</div>
            <h1 style="font-size: 2.5rem; margin-bottom: 20px;">Order Placed Successfully!</h1>
            <p style="color: #aaa; font-size: 1.1rem; line-height: 1.6; margin-bottom: 30px;">
                Thank you for your simulated purchase! Your order details have been saved locally. Real-world shipping
                times do not apply in this simulated environment.
            </p>
            <a href="index.html" class="btn btn-primary" style="margin-right: 15px;">Return to Home</a>
            <a href="Explore.html" class="btn btn-outline">Keep Shopping</a>
        </div>
    </main>
</body>

</html>
