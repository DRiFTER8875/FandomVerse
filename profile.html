<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - FandomVerse</title>
    <meta name="description" content="View your cart, orders, and update profile settings.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="glass">
        <a href="index.html" class="logo">FandomVerse</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="explore.html">Explore</a></li>
            <li><a href="about.html">About Us</a></li>
        </ul>
        <div class="nav-icons">
            <span id="nav-admin-link" style="display:none;"><a href="admin_dashboard.html">Admin Portal</a></span>
            <span id="nav-auth-link"><a href="login.html">Log In</a></span>
            <a href="cart.html" style="position:relative;">
                🛒 <span id="cart-count" style="display:none;">0</span>
            </a>
        </div>
    </header>

    <main class="container" style="padding: 2rem 5%; max-width: 1200px; margin: 0 auto;">
        <h1 class="page-title" style="margin-bottom: 2rem;"><span class="highlight">My</span> Profile</h1>
        <div style="display: flex; flex-wrap: wrap; gap: 2rem;">
            
            <div style="flex: 1; min-width: 300px; background: rgba(0,0,0,0.6); border: 2px solid rgba(255,102,0,0.3); padding: 2rem; border-radius: 12px; height: fit-content;">
                <div style="display: flex; align-items: center; gap: 1.5rem; margin-bottom: 2rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 2rem;">
                    <div id="profile-dp" style="width: 80px; height: 80px; border-radius: 50%; background: #FF0055; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: bold; border: 2px solid #FF6600; text-transform: uppercase;">
                        --
                    </div>
                    <div>
                        <h2 id="profile-name" style="margin: 0; font-size: 1.5rem; color: #fff;">...</h2>
                        <p id="profile-email" style="margin: 5px 0 0 0; color: #aaa;">...</p>
                    </div>
                </div>

                <h3 style="margin-bottom: 1rem; color: #FF6600;">Update Details</h3>
                <form id="update-form">
                    <div class="form-group" style="margin-bottom: 1rem;">
                        <label>Email Address</label>
                        <input type="email" id="update-email" class="form-control" style="width: 100%; border-radius: 6px; padding: 10px; border: 1px solid #444; background: #222; color: #fff;" required>
                    </div>
                    <div class="form-group" style="margin-bottom: 1.5rem;">
                        <label>New Password</label>
                        <input type="password" id="update-password" class="form-control" style="width: 100%; border-radius: 6px; padding: 10px; border: 1px solid #444; background: #222; color: #fff;" placeholder="Leave blank to keep current password">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Save Changes</button>
                    <button type="button" class="btn" id="logout-btn" style="width: 100%; margin-top: 1rem; background: transparent; border: 1px solid #FF0055; color: #FF0055;">Log Out</button>
                </form>
            </div>

            
            <div style="flex: 2; min-width: 300px; display: flex; flex-direction: column; gap: 2rem;">
                <div style="background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); padding: 2rem; border-radius: 12px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                        <h2 class="section-title" style="margin: 0; font-size: 1.5rem; text-align: left;">My Cart</h2>
                        <a href="cart.html" class="btn btn-primary">Go to Checkout</a>
                    </div>
                    <div id="profile-cart-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem;">
                        
                    </div>
                </div>

                <div style="background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); padding: 2rem; border-radius: 12px;">
                    <h2 class="section-title" style="margin-top: 0; margin-bottom: 1.5rem; font-size: 1.5rem; text-align: left;">Order History</h2>
                    <div id="profile-orders-container" style="display: flex; flex-direction: column; gap: 1rem;">
                        
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer style="margin-top: 4rem;">
        <p>&copy; 2026 FandomVerse. All Rights Reserved.</p>
    </footer>

    <script src="js/script.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
